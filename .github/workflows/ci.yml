on: [push, pull_request]

name: Continuous Integration

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # rustfmt follows every `#[cfg_attr(…, path = …)]` on `mod os` regardless of the
      # host's cfg, so this one run covers linux.rs, windows.rs, macos.rs, android.rs
      # and ios.rs alike. Nothing else here does: everything below sees exactly one
      # platform module.
      - run: cargo fmt --all --check

  build:
    name: Check, lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # tests/linux.rs runs the D-Bus legs against private dbus-daemon instances.
      - name: Install dbus
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y dbus
      # `--all-targets` covers the example and the test files too, so this subsumes a
      # plain `cargo check`.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
